<!doctype html>
<html><head><meta charset="utf-8"><style>
 /* App icon: the glass head with a glowing brain. 1024 px, opaque; iOS applies the corner mask. */
 *{margin:0}
 body{width:1024px;height:1024px;overflow:hidden;position:relative;background:
  radial-gradient(52% 46% at 56% 36%,#12424c 0%,#0a2128 45%,#04080b 100%)}
 img{position:absolute;left:-210px;top:-150px;width:1450px;height:1450px}
 .bloom{filter:blur(28px) brightness(1.3) saturate(1.3);mix-blend-mode:screen;opacity:.42}
 .floor{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(transparent,#04080b 92%)}
</style></head><body>
 <img src="renders/icon-art.png" alt="">
 <img class="bloom" src="renders/icon-art.png" alt="">
 <div class="floor"></div>
</body></html>
