<!doctype html>
<html><head><meta charset="utf-8"><style>
 /* App icon: a dark glass head drawn in rim light around a glowing brain. 1024 px, opaque; iOS applies the corner mask. */
 *{margin:0}
 body{width:1024px;height:1024px;overflow:hidden;position:relative;background:
  radial-gradient(36% 32% at 55% 38%,#0b2c33 0%,#061419 55%,transparent 100%),
  radial-gradient(120% 120% at 50% 40%,#04090b 0%,#010203 100%)}
 img{position:absolute;left:-150px;top:-175px;width:1240px;height:1240px}
 .bloom{filter:blur(22px) brightness(1.15) saturate(1.4);mix-blend-mode:screen;opacity:.4}
 /* Softens the rim light just enough to hide the skin mesh's facets. */
 .head{filter:blur(1.6px);mix-blend-mode:screen}
 .floor{position:absolute;left:0;right:0;bottom:0;height:360px;background:linear-gradient(transparent,#010203 85%)}
</style></head><body>
 <img src="renders/icon-brain.png" alt="">
 <img class="bloom" src="renders/icon-brain.png" alt="">
 <img class="head" src="renders/icon-head.png" alt="">
 <div class="floor"></div>
</body></html>
